[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdformat"
version = "0.1.0"
description = "Inspect and render Final Draft FDX/FDXT and .fddat files"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
fdformat = "fdformat.cli:main"

[tool.setuptools.packages.find]
include = ["fdformat*"]
