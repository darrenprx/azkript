name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows source tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Check publishable repository content
        run: node scripts/check-repository-content.cjs
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.txt
      - name: JavaScript regression tests
        run: npm test
      - name: Python format tests
        run: python -m unittest discover -s tests -v
