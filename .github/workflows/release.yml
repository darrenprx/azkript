name: Build versioned Windows beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-dev.txt
          exit $LASTEXITCODE
      - name: Publication and dependency security gates
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          npm run test:public
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --json --audit-level=moderate > reports/release-audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip_audit --strict -r requirements-dev.txt --format json --output reports/release-python-audit.json
          exit $LASTEXITCODE
      - name: Test source and workspace integration
        run: |
          npm test > reports/release-unit-tests.log 2>&1
          $taskUnitExit = $LASTEXITCODE
          Get-Content reports/release-unit-tests.log
          if ($taskUnitExit -ne 0) { exit $taskUnitExit }
          python -m unittest discover -s tests -v > reports/release-python-tests.log 2>&1
          $taskPythonExit = $LASTEXITCODE
          Get-Content reports/release-python-tests.log
          if ($taskPythonExit -ne 0) { exit $taskPythonExit }
          npm run test:workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:production
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:story
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:polish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:security
          exit $LASTEXITCODE
      - name: Build and verify unsigned beta
        run: npm run release:build
      - name: Packaged desktop and security checks
        env:
          AZKRIPT_TEST_EXECUTABLE: ${{ github.workspace }}\dist\win-unpacked\Azkript.exe
        run: |
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/tests/security-electron.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/tests/production-electron.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/tests/story-electron.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/tests/workspace-electron.cjs
          exit $LASTEXITCODE
      - name: Test portable and installer lifecycle in disposable hosted VM
        run: |
          node scripts/prepare-isolated-package-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File reports/isolated-package-bundle/scripts/test-packages-in-guest.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/reports/isolated-package-results" -DisposableGuest
          exit $LASTEXITCODE
      - name: Generate hash-bound QA receipt
        run: |
          $files = @('win-unpacked/Azkript.exe') + @((Get-Content dist/release.json -Raw | ConvertFrom-Json).artifacts.file)
          @($files | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path dist $_)
            @{ file = $_; status = $signature.Status.ToString() }
          }) | ConvertTo-Json | Set-Content reports/release-signatures.json -Encoding utf8
          node scripts/release-qa.cjs
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Azkript-Windows-beta
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/Azkript-*-portable.exe
            dist/Azkript-Setup-*.exe
            dist/release.json
            dist/SHA256SUMS.txt
            dist/QA-VERIFICATION.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Azkript-Windows-unpacked
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: dist/win-unpacked/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: Azkript-build-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            reports/release-*.log
            reports/isolated-package-results/
