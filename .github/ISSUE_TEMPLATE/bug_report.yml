name: Bug report
description: Report a reproducible problem using synthetic or redacted material.
body:
  - type: markdown
    attributes:
      value: "Do not attach private scripts, recovery files, credentials or personal file paths. For vulnerabilities, follow SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Azkript version and build type
      placeholder: "Version, installer / portable / source / browser"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Windows version or browser
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a small synthetic document where possible.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshots or logs
