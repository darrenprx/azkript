<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Azkript">
  <defs>
    <!--
    Azkript brand mark — Office-style document glyph.
    ================================================
    Generated by scripts/build-brand.cjs from app/brand/palettes.json and the
    geometry in scripts/lib/brand-mark.cjs. Edit those, not this file; then:

        node scripts/build-brand.cjs && node scripts/sync-brand.cjs
        python scripts/make-icon.py

    Composition:
      * NO enclosing tile. The glyph is the icon — a document sheet with a turned
        corner, saturated body gradient, no outline.
      * A heading band across the top, then a SLIGHTLY DIMMER dialogue block below
        it: the screenplay ladder, two levels of luminosity.
      * ONE rounded-square letter badge, CENTRED on the sheet rather than hanging off
        the lower-left corner, holding the S monogram.
      * White content on saturated colour; the badge is the only dark plane.
    -->
    <linearGradient id="az-page" x1="0.06" y1="0" x2="0.94" y2="1">
      <stop offset="0" stop-color="#FFD9A0"/>
      <stop offset="0.3" stop-color="#FFAE47"/>
      <stop offset="0.66" stop-color="#EE7A12"/>
      <stop offset="1" stop-color="#9A4204"/>
    </linearGradient>
    <linearGradient id="az-fold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFF0D2" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFC470" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="az-fold-shade" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#5A2606" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5A2606" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="az-rule" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#FFF4E2" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="az-badge" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#B83A0C"/>
      <stop offset="0.42" stop-color="#8E2407"/>
      <stop offset="1" stop-color="#611603"/>
    </linearGradient>
    <linearGradient id="az-badge-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="az-sheet-shadow" x="-30%" y="-30%" width="170%" height="185%">
      <feDropShadow dx="0.6" dy="1.7" stdDeviation="1.6" flood-color="#2A1203" flood-opacity="0.40"/>
    </filter>
    <filter id="az-badge-shadow" x="-45%" y="-45%" width="195%" height="205%">
      <feDropShadow dx="0.3" dy="1.2" stdDeviation="1.1" flood-color="#2A1203" flood-opacity="0.52"/>
    </filter>
    <clipPath id="az-sheet-clip">
      <path d="M10.4 3.6 H22.7513 A17.5 17.5 0 0 1 35.1256 8.7256 L38.9924 12.5924 A13 13 0 0 1 42.8 21.7848 V39.2 A5.2 5.2 0 0 1 37.6 44.4 H10.4 A5.2 5.2 0 0 1 5.2 39.2 V8.8 A5.2 5.2 0 0 1 10.4 3.6 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#az-sheet-shadow)">
    <path d="M10.4 3.6 H22.7513 A17.5 17.5 0 0 1 35.1256 8.7256 L38.9924 12.5924 A13 13 0 0 1 42.8 21.7848 V39.2 A5.2 5.2 0 0 1 37.6 44.4 H10.4 A5.2 5.2 0 0 1 5.2 39.2 V8.8 A5.2 5.2 0 0 1 10.4 3.6 Z" fill="url(#az-page)"/>
  </g>

  <g clip-path="url(#az-sheet-clip)">
    <path d="M30 3.6 L42.8 16.4 H33.5 A3.5 3.5 0 0 1 30 12.9 Z" fill="url(#az-fold)"/>
    <path d="M30 3.6 L42.8 16.4 H33 A3 3 0 0 1 30 13.4 Z" fill="url(#az-fold-shade)"/>
  </g>

  <rect x="10.2" y="8.3" width="20.4" height="4.2" rx="2.1" fill="url(#az-rule)"/>
  <rect x="10.2" y="33.8" width="18.6" height="2.85" rx="1.42" fill="url(#az-rule)" opacity="0.72"/>
  <rect x="10.2" y="38.3" width="15.2" height="2.85" rx="1.42" fill="url(#az-rule)" opacity="0.54"/>

  <g filter="url(#az-badge-shadow)">
    <rect x="16.2" y="16.2" width="15.6" height="15.6" rx="4.4" fill="url(#az-badge)"/>
  </g>
  <rect x="16.2" y="16.2" width="15.6" height="15.6" rx="4.4" fill="url(#az-badge-gloss)"/>
  <path transform="translate(20.3771 28.4449) scale(0.0062 -0.0062)" d="M98 55V375Q185 302 287 266Q389 229 493 229Q554 229 600 240Q645 251 676 270Q706 290 721 316Q736 343 736 374Q736 416 712 449Q688 482 646 510Q605 538 548 564Q491 590 425 617Q257 687 174 788Q92 889 92 1032Q92 1144 137 1224Q182 1305 260 1357Q337 1409 439 1434Q541 1458 655 1458Q767 1458 854 1444Q940 1431 1013 1403V1104Q977 1129 934 1148Q892 1167 847 1180Q802 1192 758 1198Q713 1204 673 1204Q618 1204 573 1194Q528 1183 497 1164Q466 1145 449 1118Q432 1092 432 1059Q432 1023 451 994Q470 966 505 940Q540 915 590 890Q640 866 703 840Q789 804 858 764Q926 723 975 672Q1024 621 1050 556Q1076 490 1076 403Q1076 283 1030 202Q985 120 907 70Q829 19 726 -3Q622 -25 507 -25Q389 -25 282 -5Q176 15 98 55Z" fill="#FFFFFF"/>
</svg>
